<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quiz</title>
  <link rel="stylesheet" href="styles/client.css">
  <script src="https://lint.page/kit/4d0fe3.js" crossorigin="anonymous"></script>

  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }
    .question {
      margin-bottom: 15px;
    }
    button {
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h1>HTML Quiz</h1>
    <nav>
      <a href="project_index.html">Home</a>
      <a href="project_basics.html">HTML Basics</a>
      <a href="project_editor.html">Code Editor</a>
      <a href="project_quiz.html">Quiz</a>
      <a href="project_resources.html">Resources</a>
    </nav>
  </header>

  <main>
    <h1>HTML Basics Quiz</h1>

    <div id="quiz"></div>

    <button onclick="submitQuiz()">Submit Quiz</button>

    <h2 id="result">Your score will appear here</h2>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const quizData = [
        {
          question: "What does HTML stand for?",
          options: [
            "Hyper Trainer Marking Language",
            "HyperText Markup Language",
            "HighText Machine Language"
          ],
          answer: 1
        },
        {
          question: "Which tag is used for the largest heading?",
          options: ["&lt;h6&gt;", "&lt;h1&gt;", "&lt;head&gt;"],
          answer: 1
        },
        {
          question: "Where does visible content go?",
          options: ["&lt;head&gt;", "&lt;body&gt;", "&lt;html&gt;"],
          answer: 1
        },
        {
          question: "Which tag creates a link?",
          options: ["&lt;a&gt;", "&lt;p&gt;", "&lt;img&gt;"],
          answer: 0
        },
        {
          question: "Which tag is used to display an image?",
          options: ["&lt;img&gt;", "&lt;image&gt;", "&lt;src&gt;"],
          answer: 0
        },
        {
          question: "What tag creates a paragraph?",
          options: ["&lt;para&gt;", "&lt;p&gt;", "&lt;text&gt;"],
          answer: 1
        },
        {
          question: "Which tag makes a line break?",
          options: ["&lt;lb&gt;", "&lt;br&gt;", "&lt;break&gt;"],
          answer: 1
        },
        {
          question: "What is &lt;div&gt; used for?",
          options: [
            "Creating images",
            "Grouping content",
            "Making links"
          ],
          answer: 1
        }
      ];

      const quizContainer = document.getElementById("quiz");

      function loadQuiz() {
        quizData.forEach((q, index) => {
          const div = document.createElement("div");
          div.classList.add("question");

          let html = `<p>${index + 1}. ${q.question}</p>`;

          q.options.forEach((option, i) => {
            html += `
              <label>
                <input type="radio" name="q${index}" value="${i}">
                ${option}
              </label><br>
            `;
          });

          div.innerHTML = html;
          quizContainer.appendChild(div);
        });
      }

      window.submitQuiz = function () {
        let score = 0;

        quizData.forEach((q, index) => {
          const answer = document.querySelector(`input[name="q${index}"]:checked`);
          if (answer && parseInt(answer.value) === q.answer) {
            score++;
          }
        });

        document.getElementById("result").innerText =
          `You got ${score} out of ${quizData.length} correct!`;
      };

      loadQuiz();
    });
  </script>
  <footer>
    <p>Page Built by <a href="kowaeenterprises.net/index.html">Kowae Enterprises</a> &copy; 2025 </p>
  </footer>
</body>
</html>
